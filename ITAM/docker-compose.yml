version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: itam-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-itam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itam_secure_pass}
      POSTGRES_DB: ${DB_NAME:-itam}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itam} -d ${DB_NAME:-itam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itam-app-prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-itam}:${DB_PASSWORD:-itam_secure_pass}@db:5432/${DB_NAME:-itam}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: itam-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - app

volumes:
  postgres_data:
    driver: local
